<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Korea UI Showcase: Vercel vs Olive Young Design Matrix</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.015em; }
    .mono { font-family: 'Geist Mono', monospace; }
  </style>
</head>
<body class="bg-[#0A0A0A] text-neutral-100 min-h-screen flex flex-col antialiased">
  
  <!-- Global Control Bar -->
  <header class="bg-[#111] border-b border-neutral-800 px-6 py-3.5 flex flex-col md:flex-row items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-white flex items-center justify-center text-black font-black text-xs">RK</div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-sm text-white">REAL KOREA DESIGN LAB</span>
          <span class="text-[11px] px-2 py-0.5 rounded bg-neutral-800 text-neutral-400 mono">VERCEL × OLIVE YOUNG</span>
        </div>
        <div class="text-xs text-neutral-500">5종 인터랙티브 목업 실시간 비교 쇼케이스</div>
      </div>
    </div>

    <!-- Mockup Switcher Tabs -->
    <div class="flex items-center gap-1.5 bg-neutral-900/90 p-1 rounded-xl border border-neutral-800 overflow-x-auto max-w-full">
      <button onclick="loadMockup(1)" id="tab-1" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-black transition-all">
        #1 Vercel 교통 계산기
      </button>
      <button onclick="loadMockup(2)" id="tab-2" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-neutral-400 hover:text-white transition-all">
        #2 올영 텍스리펀 & 픽
      </button>
      <button onclick="loadMockup(3)" id="tab-3" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-neutral-400 hover:text-white transition-all">
        #3 Vercel 기후카드 표
      </button>
      <button onclick="loadMockup(4)" id="tab-4" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-neutral-400 hover:text-white transition-all">
        #4 올영 심야 편의점
      </button>
      <button onclick="loadMockup(5)" id="tab-5" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-neutral-400 hover:text-white transition-all">
        #5 하이브리드 종합판
      </button>
    </div>

    <!-- Viewport Mode Toggle -->
    <div class="flex items-center gap-2 text-xs">
      <button onclick="setViewport('desktop')" id="vp-desktop" class="px-2.5 py-1.5 rounded-md bg-neutral-800 text-white font-medium border border-neutral-700">Desktop</button>
      <button onclick="setViewport('mobile')" id="vp-mobile" class="px-2.5 py-1.5 rounded-md bg-neutral-900 text-neutral-400 font-medium border border-neutral-800 hover:text-white">Mobile (390px)</button>
      <a id="externalLink" href="mockup_1_vercel_transport.html" target="_blank" class="px-2.5 py-1.5 rounded-md bg-neutral-800 hover:bg-neutral-700 text-neutral-300 flex items-center gap-1">
        <span>새 탭으로 열기</span>
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>
  </header>

  <!-- Explanatory Context Strip -->
  <div class="bg-neutral-950 border-b border-neutral-900 px-6 py-2.5 text-xs text-neutral-400 flex items-center justify-between">
    <div id="mockupDescription" class="flex items-center gap-2">
      <strong class="text-white font-semibold">[Vercel Style]</strong>
      <span>AREX 직통 vs 일반열차 도어투도어 소요시간 및 층별 환승 계단수 실시간 계산기</span>
    </div>
    <div class="mono text-[11px] text-neutral-500 hidden md:block">
      LIVE INTERACTIVE PROTOTYPE
    </div>
  </div>

  <!-- Main Showcase Canvas -->
  <main class="flex-1 flex justify-center items-start bg-[#050505] p-4 md:p-8 overflow-hidden">
    <div id="frameWrapper" class="w-full h-[82vh] max-w-6xl transition-all duration-300 rounded-xl overflow-hidden border border-neutral-800 shadow-2xl bg-black">
      <iframe id="mockupFrame" src="mockup_1_vercel_transport.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    const mockups = {
      1: {
        file: 'mockup_1_vercel_transport.html',
        desc: '<strong class="text-white font-semibold">[Vercel Style #1]</strong> AREX 직통 vs 일반열차 소요시간·환승 층수(B7 vs B3) 정밀 계산기 및 의사결정 시트 (Geist 타이포, 흑백 모노크롬, Executive/Audit 경로)'
      },
      2: {
        file: 'mockup_2_oliveyoung_kbeauty.html',
        desc: '<strong class="text-white font-semibold">[Olive Young Style #2]</strong> K-뷰티 올리브영 즉시환급(15,000원 이상 결제 시 여권 7% 즉시할인 계산기) + 13° 타원 모티프 & 올영픽 베스트 3'
      },
      3: {
        file: 'mockup_3_vercel_climate_matrix.html',
        desc: '<strong class="text-white font-semibold">[Vercel Style #3]</strong> 기후동행카드 신분당선·빨간버스 경계선 감사 매트릭스 (12컬럼 풀 에비던스 테이블, 실시간 검색/필터, 서울시 공문 번호)'
      },
      4: {
        file: 'mockup_4_oliveyoung_night_curation.html',
        desc: '<strong class="text-white font-semibold">[Olive Young Style #4]</strong> 심야 편의점 K-미식 꿀조합 큐레이션 (마크정식, 갈아만든배 숙취해소, 감동란 조합, 바텀시트 칩 필터)'
      },
      5: {
        file: 'mockup_5_hybrid_realkorea.html',
        desc: '<strong class="text-white font-semibold">[Hybrid Style #5]</strong> 차세대 Real Korea 아티클: Vercel의 정밀한 정보구조(IA) + 올리브영의 활력 넘치는 검증 배지 & 환전 수수료 모의 시뮬레이터'
      }
    };

    let currentMockup = 1;
    const iframe = document.getElementById('mockupFrame');
    const desc = document.getElementById('mockupDescription');
    const extLink = document.getElementById('externalLink');
    const frameWrapper = document.getElementById('frameWrapper');

    function loadMockup(id) {
      currentMockup = id;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        if (idx + 1 === id) {
          btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-black transition-all";
        } else {
          btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-neutral-400 hover:text-white transition-all";
        }
      });
      iframe.src = mockups[id].file;
      desc.innerHTML = mockups[id].desc;
      extLink.href = mockups[id].file;
    }

    function setViewport(mode) {
      const btnDesk = document.getElementById('vp-desktop');
      const btnMob = document.getElementById('vp-mobile');

      if (mode === 'mobile') {
        frameWrapper.style.maxWidth = '390px';
        frameWrapper.style.height = '844px';
        btnMob.className = "px-2.5 py-1.5 rounded-md bg-neutral-800 text-white font-medium border border-neutral-700";
        btnDesk.className = "px-2.5 py-1.5 rounded-md bg-neutral-900 text-neutral-400 font-medium border border-neutral-800 hover:text-white";
      } else {
        frameWrapper.style.maxWidth = '1152px';
        frameWrapper.style.height = '82vh';
        btnDesk.className = "px-2.5 py-1.5 rounded-md bg-neutral-800 text-white font-medium border border-neutral-700";
        btnMob.className = "px-2.5 py-1.5 rounded-md bg-neutral-900 text-neutral-400 font-medium border border-neutral-800 hover:text-white";
      }
    }
  </script>
</body>
</html>
