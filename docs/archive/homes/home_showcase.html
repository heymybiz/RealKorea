<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Korea: 5-Concept Home Page Showcase (Olive Young Palette)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: -0.025em; }
    .olive-badge { transform: rotate(-13deg); }
  </style>
</head>
<body class="bg-[#111315] text-neutral-100 min-h-screen flex flex-col antialiased">
  
  <!-- Global Top Bar -->
  <header class="bg-[#1A1D20] border-b border-[#2A2E33] px-6 py-3.5 flex flex-col md:flex-row items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-xl bg-[#82DC28] flex items-center justify-center text-[#17300B] font-black text-xs shadow-md">
        RK
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-black text-sm text-white">REAL KOREA HOME LAB</span>
          <span class="text-[11px] px-2 py-0.5 rounded-full bg-[#82DC28] text-[#17300B] font-black">
            올리브영 톤 메인 5종
          </span>
        </div>
        <div class="text-xs text-[#999]">메인 페이지만 5개의 완전히 다른 컨셉과 구조로 설계된 인터랙티브 쇼케이스</div>
      </div>
    </div>

    <!-- 5 Home Concept Switcher Tabs -->
    <div class="flex items-center gap-1.5 bg-[#111315] p-1 rounded-xl border border-[#2A2E33] overflow-x-auto max-w-full">
      <button onclick="loadHome(1)" id="tab-1" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-black bg-[#82DC28] text-[#17300B] shadow-sm transition-all">
        #1 스마트 유틸리티형
      </button>
      <button onclick="loadHome(2)" id="tab-2" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-[#AAA] hover:text-white transition-all">
        #2 에디토리얼 매거진형
      </button>
      <button onclick="loadHome(3)" id="tab-3" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-[#AAA] hover:text-white transition-all">
        #4 동네 인터랙티브형
      </button>
      <button onclick="loadHome(4)" id="tab-4" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-[#AAA] hover:text-white transition-all">
        #4 여정 타임라인형
      </button>
      <button onclick="loadHome(5)" id="tab-5" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-[#AAA] hover:text-white transition-all">
        #5 앱 위젯 피드형
      </button>
    </div>

    <!-- Viewport Mode Toggle -->
    <div class="flex items-center gap-2 text-xs">
      <button onclick="setViewport('desktop')" id="vp-desktop" class="px-2.5 py-1.5 rounded-lg bg-[#2A2E33] text-white font-bold border border-[#3A4047]">Desktop</button>
      <button onclick="setViewport('mobile')" id="vp-mobile" class="px-2.5 py-1.5 rounded-lg bg-[#111315] text-[#AAA] font-bold border border-[#2A2E33] hover:text-white">Mobile (390px)</button>
      <a id="externalLink" href="home_concept_1_utility.html" target="_blank" class="px-2.5 py-1.5 rounded-lg bg-[#2A2E33] hover:bg-[#33383F] text-white flex items-center gap-1 font-bold">
        <span>새 탭으로 열기</span>
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>
  </header>

  <!-- Explanatory Context Strip -->
  <div class="bg-[#14171A] border-b border-[#22262B] px-6 py-2.5 text-xs text-[#AAA] flex items-center justify-between">
    <div id="homeDescription" class="flex items-center gap-2">
      <strong class="text-white font-bold">[메인 컨셉 1: 스마트 유틸리티 & 퀵 내비게이터]</strong>
      <span>첫 화면에서 4대 즉시 해결 버튼 + 지하철 탑승 횟수별 기후동행카드 vs 1회권 실시간 비교 계산기</span>
    </div>
    <div class="text-[11px] text-[#777] hidden md:block font-mono">
      LIVE INTERACTIVE PROTOTYPE
    </div>
  </div>

  <!-- Main Canvas Frame -->
  <main class="flex-1 flex justify-center items-start bg-[#0D0F11] p-4 md:p-8 overflow-hidden">
    <div id="frameWrapper" class="w-full h-[82vh] max-w-6xl transition-all duration-300 rounded-2xl overflow-hidden border border-[#2A2E33] shadow-2xl bg-[#F8F9FA]">
      <iframe id="homeFrame" src="home_concept_1_utility.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    const homes = {
      1: {
        file: 'home_concept_1_utility.html',
        desc: '<strong class="text-white font-bold">[메인 컨셉 1: 스마트 유틸리티 & 퀵 내비게이터]</strong> 첫 화면에서 4대 즉시 해결 버튼(AREX/기후카드/텍스리펀/심야교통) + 지하철 탑승 횟수별 기후동행카드 vs 1회권 실시간 비교 슬라이더 계산기'
      },
      2: {
        file: 'home_concept_2_magazine.html',
        desc: '<strong class="text-white font-bold">[메인 컨셉 2: 에디토리얼 매거진 & 스토리]</strong> 올리브영 매거진 스타일: 대담한 커버 스토리 레이아웃 + 넉넉한 타이포그래피 + 주간 에디터스 픽(카드/쇼핑/심야) 3열 매거진 스프레드'
      },
      3: {
        file: 'home_concept_3_district_map.html',
        desc: '<strong class="text-white font-bold">[메인 컨셉 3: 동네 & 지도 인터랙티브 탐색]</strong> 서울 4대 핵심 구역(성수, 명동, 종로, 홍대) 탭 전환 시 배너 컬러, 핵심 주의사항, 검증 로컬 맛집 2곳이 실시간으로 바뀌는 동네 중심 메인'
      },
      4: {
        file: 'home_concept_4_journey_timeline.html',
        desc: '<strong class="text-white font-bold">[메인 컨셉 4: 72시간 도착 여정 타임라인]</strong> 시간대별(Hour 0 공항도착 → Hour 2 서울역 환승 → Hour 5 첫날 삼겹살 저녁 → Day 2 쇼핑&심야) 여행자의 동선에 맞춘 스텝 바이 스텝 여정형 메인'
      },
      5: {
        file: 'home_concept_5_app_widgets.html',
        desc: '<strong class="text-white font-bold">[메인 컨셉 5: 모바일 퍼스트 앱 위젯 허브]</strong> 모바일 앱의 쫀득한 UX: 인스타 스토리 서클 + 2x2 라이브 위젯(환율/지하철막차/날씨/SOS) + 무한 피드 카드 + 하단 플로팅 탭바'
      }
    };

    let currentHome = 1;
    const iframe = document.getElementById('homeFrame');
    const desc = document.getElementById('homeDescription');
    const extLink = document.getElementById('externalLink');
    const frameWrapper = document.getElementById('frameWrapper');

    function loadHome(id) {
      currentHome = id;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        if (idx + 1 === id) {
          btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-black bg-[#82DC28] text-[#17300B] shadow-sm transition-all";
        } else {
          btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-bold text-[#AAA] hover:text-white transition-all";
        }
      });
      iframe.src = homes[id].file;
      desc.innerHTML = homes[id].desc;
      extLink.href = homes[id].file;
    }

    function setViewport(mode) {
      const btnDesk = document.getElementById('vp-desktop');
      const btnMob = document.getElementById('vp-mobile');

      if (mode === 'mobile') {
        frameWrapper.style.maxWidth = '390px';
        frameWrapper.style.height = '844px';
        btnMob.className = "px-2.5 py-1.5 rounded-lg bg-[#2A2E33] text-white font-bold border border-[#3A4047]";
        btnDesk.className = "px-2.5 py-1.5 rounded-lg bg-[#111315] text-[#AAA] font-bold border border-[#2A2E33] hover:text-white";
      } else {
        frameWrapper.style.maxWidth = '1152px';
        frameWrapper.style.height = '82vh';
        btnDesk.className = "px-2.5 py-1.5 rounded-lg bg-[#2A2E33] text-white font-bold border border-[#3A4047]";
        btnMob.className = "px-2.5 py-1.5 rounded-lg bg-[#111315] text-[#AAA] font-bold border border-[#2A2E33] hover:text-white";
      }
    }
  </script>
</body>
</html>
